<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120" role="img" aria-labelledby="title desc">
  <title id="title">Velox Agentic Earnings Research Architecture</title>
  <desc id="desc">A multi-agent architecture diagram for Velox showing user boundary, orchestration, parallel evidence collection, staged LLM analysis, public tools, memory, reviewed outputs, telemetry, evaluation scope, and failure handling.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 800 36px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #111827; letter-spacing: .2px; }
      .subtitle { font: 500 23px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #4b5563; }
      .lane-title { font: 800 24px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #111827; }
      .card-title { font: 800 24px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #111827; }
      .card-title-small { font: 800 20px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #111827; }
      .body { font: 600 18px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #273244; }
      .body-small { font: 600 15px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #273244; }
      .tiny { font: 700 13px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #4b5563; }
      .pill-text { font: 900 20px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: white; }
      .note-title { font: 800 23px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #c2410c; }
      .note-body { font: 600 18px "Avenir Next", "Segoe UI", system-ui, sans-serif; fill: #273244; }
      .lane { fill: white; stroke-width: 4; stroke-dasharray: 10 10; rx: 26; }
      .card { stroke-width: 4; rx: 20; filter: url(#softShadow); }
      .mini { stroke-width: 3; rx: 18; }
      .flow { stroke: #174ea6; stroke-width: 7; fill: none; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .toolflow { stroke: #188038; stroke-width: 6; fill: none; marker-end: url(#arrowGreen); stroke-linecap: round; stroke-linejoin: round; }
      .llmflow { stroke: #6d28d9; stroke-width: 5; fill: none; marker-end: url(#arrowPurple); stroke-dasharray: 12 10; stroke-linecap: round; stroke-linejoin: round; }
      .memflow { stroke: #be185d; stroke-width: 5; fill: none; marker-end: url(#arrowPink); stroke-dasharray: 12 9; stroke-linecap: round; stroke-linejoin: round; }
      .warnflow { stroke: #ea580c; stroke-width: 5; fill: none; marker-end: url(#arrowOrange); stroke-dasharray: 10 9; stroke-linecap: round; stroke-linejoin: round; }
      .evalflow { stroke: #dc2626; stroke-width: 5; fill: none; marker-end: url(#arrowRed); stroke-dasharray: 9 9; stroke-linecap: round; stroke-linejoin: round; }
      .brush-blue { fill: #1d75bd; }
      .brush-green { fill: #0f8b62; }
      .brush-purple { fill: #6d28d9; }
      .brush-orange { fill: #f97316; }
      .brush-pink { fill: #db2777; }
      .brush-red { fill: #ef4444; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#111827" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12" fill="none" stroke="#174ea6" stroke-width="2.5"/></marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12" fill="none" stroke="#188038" stroke-width="2.5"/></marker>
    <marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12" fill="none" stroke="#6d28d9" stroke-width="2.5"/></marker>
    <marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12" fill="none" stroke="#be185d" stroke-width="2.5"/></marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12" fill="none" stroke="#ea580c" stroke-width="2.5"/></marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12" fill="none" stroke="#dc2626" stroke-width="2.5"/></marker>
  </defs>

  <rect class="bg" width="2000" height="1120"/>
  <text class="title" x="900" y="66" text-anchor="middle">Velox - Agentic Earnings Research Architecture</text>
  <text class="subtitle" x="900" y="103" text-anchor="middle">Stateful multi-agent workflow with explicit tools, memory, failure handling, and human approval</text>

  <rect class="lane" x="55" y="150" width="230" height="550" stroke="#1d75bd" fill="#e8f4ff"/>
  <rect class="lane" x="330" y="150" width="260" height="550" stroke="#64748b" fill="#f8fafc"/>
  <rect class="lane" x="635" y="150" width="390" height="550" stroke="#6d28d9" fill="#f4f0ff"/>
  <rect class="lane" x="1070" y="150" width="300" height="550" stroke="#0f8b62" fill="#eafaf1"/>
  <rect class="lane" x="1415" y="150" width="315" height="550" stroke="#f97316" fill="#fff4e6"/>

  <text class="lane-title" x="88" y="190">USER BOUNDARY</text>
  <text class="lane-title" x="365" y="190">CONTROL + STATE</text>
  <text class="lane-title" x="678" y="190">AI AGENT GRAPH</text>
  <text class="lane-title" x="1110" y="190">TOOLS + MEMORY</text>
  <text class="lane-title" x="1458" y="190">REVIEWED OUTPUT</text>

  <g id="ticker-card">
    <rect class="card" x="83" y="245" width="175" height="150" fill="#d9ecff" stroke="#1d75bd"/>
    <path class="brush-blue" d="M105 265 C135 255 205 258 238 265 L236 302 C196 296 145 300 105 302 Z"/>
    <text class="pill-text" x="127" y="291">INPUT</text>
    <circle cx="144" cy="344" r="25" fill="#fff" stroke="#1d75bd" stroke-width="4"/>
    <path d="M162 362 L185 385" stroke="#1d75bd" stroke-width="6" stroke-linecap="round"/>
    <text class="body" x="178" y="336" text-anchor="middle">
      <tspan x="178" dy="0">Ticker search</tspan>
      <tspan x="178" dy="24">US public co.</tspan>
    </text>
  </g>

  <g id="approval-card">
    <rect class="card" x="83" y="500" width="175" height="120" fill="#fff6cf" stroke="#f59f00"/>
    <path class="brush-orange" d="M103 518 C137 511 205 513 238 520 L236 552 C192 548 145 549 105 552 Z"/>
    <text class="pill-text" x="125" y="543">APPROVAL</text>
    <text class="body-small" x="170" y="578" text-anchor="middle">
      <tspan x="170" dy="0">User approves</tspan>
      <tspan x="170" dy="21">before memory</tspan>
      <tspan x="170" dy="18">is saved</tspan>
    </text>
  </g>

  <g id="supervisor-card">
    <rect class="card" x="360" y="230" width="200" height="130" fill="#ffffff" stroke="#64748b"/>
    <path d="M415 322 C440 292 462 284 492 260" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="496" cy="258" r="10" fill="#34d399" stroke="#0f172a" stroke-width="4"/>
    <circle cx="462" cy="287" r="10" fill="#fbbf24" stroke="#0f172a" stroke-width="4"/>
    <circle cx="428" cy="318" r="10" fill="#fb7185" stroke="#0f172a" stroke-width="4"/>
    <text class="card-title-small" x="390" y="256">Orchestrator</text>
    <text class="body-small" x="458" y="346" text-anchor="middle">
      <tspan x="458" dy="0">routes, retries</tspan>
      <tspan x="458" dy="20">branches on failure</tspan>
    </text>
  </g>

  <g id="state-card">
    <rect class="card" x="360" y="405" width="200" height="105" fill="#ffffff" stroke="#64748b"/>
    <path d="M420 425 h75 a18 18 0 0 1 18 18 v35 a18 18 0 0 1 -18 18 h-75 a18 18 0 0 1 -18 -18 v-35 a18 18 0 0 1 18 -18 z" fill="#eef2ff" stroke="#64748b" stroke-width="4"/>
    <path d="M402 450 h111 M402 474 h111" stroke="#64748b" stroke-width="4"/>
    <text class="body-small" x="458" y="530" text-anchor="middle">
      <tspan x="458" dy="0">Checkpointed state</tspan>
      <tspan x="458" dy="20">evidence, gaps, approval</tspan>
    </text>
  </g>

  <g id="ledger-card">
    <rect class="card" x="360" y="555" width="200" height="105" fill="#fff4e6" stroke="#f97316"/>
    <path class="brush-orange" d="M385 570 C420 562 500 566 535 572 L534 600 C488 596 425 598 386 600 Z"/>
    <text class="pill-text" x="409" y="592">LEDGER</text>
    <text class="body-small" x="458" y="630" text-anchor="middle">
      <tspan x="458" dy="0">status, duration</tspan>
      <tspan x="458" dy="20">freshness, fallback</tspan>
    </text>
  </g>

  <g id="agent-pipeline">
    <rect class="mini" x="685" y="220" width="290" height="72" fill="#efe7ff" stroke="#6d28d9"/>
    <circle cx="705" cy="220" r="27" fill="#6d28d9"/>
    <text class="pill-text" x="698" y="228">1</text>
    <text class="card-title-small" x="740" y="252">Evidence Collection</text>
    <text class="body-small" x="830" y="277" text-anchor="middle">parallel: market, SEC, news, memory</text>

    <rect class="mini" x="685" y="322" width="290" height="72" fill="#e7fbff" stroke="#0891b2"/>
    <circle cx="705" cy="322" r="27" fill="#0891b2"/>
    <text class="pill-text" x="698" y="330">2</text>
    <text class="card-title-small" x="760" y="354">Evidence Pack</text>
    <text class="body-small" x="830" y="379" text-anchor="middle">normalize sources, gaps, freshness</text>

    <rect class="mini" x="685" y="424" width="290" height="72" fill="#fff0f6" stroke="#db2777"/>
    <circle cx="705" cy="424" r="27" fill="#db2777"/>
    <text class="pill-text" x="698" y="432">3</text>
    <text class="card-title-small" x="754" y="456">Analysis Stage</text>
    <text class="body-small" x="830" y="481" text-anchor="middle">parallel: news themes + delta</text>

    <rect class="mini" x="685" y="526" width="290" height="92" fill="#fff7ed" stroke="#f97316"/>
    <circle cx="705" cy="526" r="27" fill="#f97316"/>
    <text class="pill-text" x="698" y="534">4</text>
    <text class="card-title-small" x="735" y="558">Risk + Draft + Review</text>
    <text class="body-small" x="830" y="583" text-anchor="middle">
      <tspan x="830" dy="0">risk uses analysis outputs</tspan>
      <tspan x="830" dy="20">then brief + guardrail check</tspan>
    </text>
  </g>

  <g id="tool-cards">
    <rect class="mini" x="1105" y="220" width="230" height="72" fill="#dcfce7" stroke="#0f8b62"/>
    <text class="card-title-small" x="1132" y="250">Market Data MCP</text>
    <text class="body-small" x="1220" y="276" text-anchor="middle">symbols, earnings, quotes, news</text>

    <rect class="mini" x="1105" y="322" width="230" height="72" fill="#dcfce7" stroke="#0f8b62"/>
    <text class="card-title-small" x="1150" y="352">SEC EDGAR</text>
    <text class="body-small" x="1220" y="378" text-anchor="middle">filings, facts, CIK mapping</text>

    <rect class="mini" x="1105" y="424" width="230" height="72" fill="#efe7ff" stroke="#6d28d9"/>
    <text class="card-title-small" x="1150" y="454">LLM Providers</text>
    <text class="body-small" x="1220" y="480" text-anchor="middle">curated prompts per role</text>

    <rect class="mini" x="1105" y="526" width="230" height="72" fill="#fff0f6" stroke="#db2777"/>
    <text class="card-title-small" x="1165" y="556">Mem0</text>
    <text class="body-small" x="1220" y="582" text-anchor="middle">10 approved ticker reports max</text>

    <rect class="mini" x="1105" y="625" width="230" height="50" fill="#f1f5f9" stroke="#64748b"/>
    <text class="body-small" x="1220" y="655" text-anchor="middle">local JSON snapshots</text>
  </g>

  <g id="output-cards">
    <rect class="card" x="1450" y="220" width="245" height="118" fill="#ffedd5" stroke="#f97316"/>
    <path class="brush-orange" d="M1480 238 C1530 228 1628 230 1665 238 L1660 272 C1600 266 1534 268 1482 272 Z"/>
    <text class="pill-text" x="1528" y="262">BRIEF</text>
    <text class="body-small" x="1572" y="306" text-anchor="middle">
      <tspan x="1572" dy="0">facts, risks, delta</tspan>
      <tspan x="1572" dy="21">warnings, source labels</tspan>
    </text>

    <rect class="card" x="1450" y="390" width="245" height="112" fill="#fee2e2" stroke="#ef4444"/>
    <text class="card-title-small" x="1492" y="428">Visible Failures</text>
    <text class="body-small" x="1572" y="462" text-anchor="middle">
      <tspan x="1572" dy="0">missing data, stale fallback</tspan>
      <tspan x="1572" dy="21">unsupported claims blocked</tspan>
    </text>

    <rect class="card" x="1450" y="552" width="245" height="108" fill="#ffedd5" stroke="#f97316"/>
    <text class="card-title-small" x="1505" y="590">Telemetry</text>
    <text class="body-small" x="1572" y="622" text-anchor="middle">
      <tspan x="1572" dy="0">slowest step, retries</tspan>
      <tspan x="1572" dy="21">tool and format timings</tspan>
    </text>
  </g>

  <path class="flow" d="M260 320 C295 320 315 295 355 295"/>
  <path class="flow" d="M560 295 C595 295 615 256 678 256"/>
  <path class="flow" d="M830 295 L830 315"/>
  <path class="flow" d="M830 397 L830 418"/>
  <path class="flow" d="M830 498 L830 520"/>
  <path class="flow" d="M975 572 C1110 572 1300 283 1442 283"/>
  <path class="flow" d="M1572 338 L1572 382"/>
  <path class="flow" d="M1572 502 L1572 544"/>

  <path class="toolflow" d="M975 252 C1030 252 1048 252 1098 252"/>
  <path class="toolflow" d="M975 358 C1030 358 1048 358 1098 358"/>
  <path class="llmflow" d="M975 572 C1035 572 1050 460 1098 460"/>
  <path class="llmflow" d="M975 572 C1050 572 1055 462 1098 462"/>
  <path class="memflow" d="M975 460 C1035 460 1050 562 1098 562"/>
  <path class="warnflow" d="M560 635 C780 665 1225 665 1442 610"/>
  <path class="memflow" d="M260 562 C330 720 900 725 1098 585"/>
  <path class="evalflow" d="M1508 390 C1360 775 1030 780 830 618"/>

  <g id="legend">
    <rect x="70" y="740" width="560" height="160" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#softShadow)"/>
    <text class="card-title-small" x="100" y="780">Flow Legend</text>
    <path class="flow" d="M105 815 L205 815"/>
    <text class="body-small" x="225" y="821">runtime control flow</text>
    <path class="toolflow" d="M105 850 L205 850"/>
    <text class="body-small" x="225" y="856">external tool calls</text>
    <path class="llmflow" d="M105 885 L205 885"/>
    <text class="body-small" x="225" y="891">LLM calls</text>
    <path class="memflow" d="M375 815 L475 815"/>
    <text class="body-small" x="495" y="821">approved memory write</text>
    <path class="warnflow" d="M375 850 L475 850"/>
    <text class="body-small" x="495" y="856">telemetry/fallback trace</text>
    <path class="evalflow" d="M375 885 L475 885"/>
    <text class="body-small" x="495" y="891">offline/system eval</text>
  </g>

  <g id="eval-cards">
    <rect class="card" x="690" y="760" width="440" height="110" fill="#ecfdf5" stroke="#0f8b62"/>
    <path class="brush-green" d="M720 780 C805 765 1010 770 1095 780 L1088 820 C965 812 835 814 725 822 Z"/>
    <text class="pill-text" x="805" y="808">SYSTEM EVALUATION</text>
    <text class="body-small" x="910" y="842" text-anchor="middle">
      <tspan x="910" dy="0">covers routing, state, tools, memory,</tspan>
      <tspan x="910" dy="22">guardrails, and final brief quality</tspan>
    </text>

    <rect class="card" x="1175" y="760" width="260" height="110" fill="#fff5f5" stroke="#ef4444"/>
    <text class="card-title-small" x="1215" y="800">Model Eval</text>
    <text class="body-small" x="1305" y="830" text-anchor="middle">
      <tspan x="1305" dy="0">checks LLM-backed</tspan>
      <tspan x="1305" dy="21">agent outputs only</tspan>
    </text>
  </g>

  <g id="failure-callout">
    <rect class="card" x="165" y="950" width="1395" height="105" fill="#fff7ed" stroke="#f97316"/>
    <path d="M210 1015 L245 962 L280 1015 Z" fill="#fff3bf" stroke="#f97316" stroke-width="5" stroke-linejoin="round"/>
    <text x="245" y="1004" text-anchor="middle" font="900 35px Avenir Next, Segoe UI, sans-serif" fill="#f97316">!</text>
    <text class="note-title" x="315" y="992">Each layer is an independent failure point</text>
    <text class="note-body" x="315" y="1018">
      <tspan x="315" dy="0">Prompt drift changes behavior. Tool errors break workflows. Stale memory misleads deltas.</tspan>
      <tspan x="315" dy="25">Weak guardrails allow unsupported claims. Velox records these states instead of hiding them.</tspan>
    </text>
  </g>
</svg>
